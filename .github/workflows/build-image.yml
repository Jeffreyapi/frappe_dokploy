name: Validate and publish caller image
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      frappe-version:
        type: string
        default: v16.33.1
      frappe-revision:
        type: string
        default: 988e54f3c4c291e2077a83809663f123731abe76
      python-version:
        type: string
        default: "3.14"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Validate caller
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check .
          python -m pytest tests/
          test -f tests/smoke.sh
      - run: python frappe_deploy/scripts/prepare_build.py --output .build/source --revision "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frappe_deploy
          file: frappe_deploy/Dockerfile
          build-contexts: app_source=./.build/source
          tags: hermes-control:ci
          load: true
          build-args: |
            FRAPPE_VERSION=${{ inputs.frappe-version }}
            FRAPPE_REVISION=${{ inputs.frappe-revision }}
            SOURCE_REVISION=${{ github.sha }}
      - run: bash tests/smoke.sh
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}:sha-$GITHUB_SHA"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing SHA image" >&2; exit 1
          fi
          docker tag hermes-control:ci "$image"
          docker push "$image"
