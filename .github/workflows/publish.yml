name: Toolkit validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install textual
      - run: python scripts/test_fd.py
      - run: python -m compileall -q scripts deploy/scripts
      - run: bash -n scripts/devcontainer-setup.sh && bash -n deploy/scripts/site.sh && bash -n deploy/scripts/init.sh
